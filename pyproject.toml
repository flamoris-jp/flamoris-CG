[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flamoris-cg"
version = "0.1.0"
description = "Experimental script-driven CG clip laboratory for FLAMORIS"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# Isolated notification experiment; do not install into Hub's MCP 2 environment.
events = ["mcp==1.30.0", "uvicorn>=0.31,<1"]
# Offline, manually annotated image interpolation experiment only.
two-pose-lab = ["numpy>=2,<3", "scipy>=1.14,<2", "Pillow>=11,<13", "contourpy>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]

